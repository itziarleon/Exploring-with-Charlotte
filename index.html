<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Come exploring with Charlotte!</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="landing-page">
      <section class="landing-page__hero">
        <h1 class="landing-page__title">
          <span>Come exploring</span>
          <span>with CHARLOTTE!!</span>
        </h1>

        <div class="landing-page__grid">
          <div
            class="landing-page__map-wrap"
            aria-label="Treasure map illustration"
          >
            <img
              class="landing-page__map"
              src="img/old-treasure-map-sketch-hand-drawn-illustrations-vector 1.png"
              alt="Treasure map illustration"
            />
          </div>

          <div
            class="landing-page__character-wrap"
            aria-label="Charlotte explorer illustration"
          >
            <img
              class="landing-page__character"
              src="img/5ed08e91-9a85-48cb-a1f1-54abcce112e0_rwc_22x18x1179x1179x1179 1.png"
              alt="Charlotte explorer character"
            />
          </div>
        </div>

        <div class="landing-page__note">
          TO START, PLEASE SCAN THE ANIMAL YOU WANT TO
          <br />
          KNOW MORE ABOUT IN THE SCANNER!!!!
        </div>
      </section>
    </main>
  </body>
</html>
